name: Staleness Check

on:
  push:
    branches: [ main, "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  staleness:
    name: Check for stale model names and deprecated APIs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run staleness scanner
        run: python scripts/check_staleness.py .
