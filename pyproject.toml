[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dagpipe-core"
version = "0.1.0"
description = "Zero-cost, crash-proof LLM pipeline orchestrator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Herbert" }]
keywords = ["llm", "pipeline", "dag", "orchestrator", "free-tier", "checkpointing", "structured-output", "pydantic", "langchain-alternative", "llm-pipeline", "ai-pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/devilsfave/dagpipe"
Documentation = "https://github.com/devilsfave/dagpipe#readme"
Repository = "https://github.com/devilsfave/dagpipe"
Issues = "https://github.com/devilsfave/dagpipe/issues"
Changelog = "https://github.com/devilsfave/dagpipe/releases"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
